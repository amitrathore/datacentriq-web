<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:100%;font-family:'IBM Plex Sans',sans-serif;">
  <div style="display:flex;gap:32px;flex-wrap:wrap;margin-bottom:22px;">
    <sc-for list="{{ stats }}" as="st" hint-placeholder-count="3">
      <div>
        <div style="font-weight:600;letter-spacing:-0.04em;font-size:31px;line-height:1;font-variant-numeric:tabular-nums;color:#F3F2EF;">{{ st.v }}</div>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;color:#8F8D85;margin-top:8px;">{{ st.l }}</div>
      </div>
    </sc-for>
  </div>
  <div style="display:flex;align-items:flex-end;gap:7px;height:88px;">
    <sc-for list="{{ bars }}" as="b" hint-placeholder-count="6">
      <div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;">
        <div style="width:100%;height:{{ b.h }}%;background:#2f6fb2;border-radius:3px 3px 0 0;min-height:2px;"></div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:520,&quot;height&quot;:200},&quot;stats&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Array&lt;{v:string,l:string}&gt;&quot;},&quot;bars&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Array&lt;{h:number}&gt;&quot;}}"></script>
</body>
</html>
